# Cargo configuration for the Links project
# https://doc.rust-lang.org/cargo/reference/config.html

# Use faster linker on supported platforms
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# macOS ARM64 optimizations
[target.aarch64-apple-darwin]
rustflags = [
    "-C",
    "target-cpu=native",        # Optimize for the current CPU
    "-C",
    "link-arg=-Wl,-dead_strip", # Remove unused code
]

# macOS x86_64 (Intel) optimizations
[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=native", "-C", "link-arg=-Wl,-dead_strip"]

# Build configuration
[build]
# Use all CPU cores for parallel compilation
# jobs = 0  # 0 = use all cores (commented out due to cargo limitation)

# Incremental compilation (faster rebuilds in dev)
incremental = true

# Show timings for each crate
#timings = ["html", "json"]

# Network configuration
[net]
# Retry failed downloads
retry = 3

# Git fetch with CLI (faster than libgit2)
git-fetch-with-cli = true

# Registry configuration
[registries.crates-io]
protocol = "sparse"

# Alias for common commands
[alias]
# Fast check without codegen
c = "check"
ca = "check --all-targets"

# Build commands
b = "build"
br = "build --release"
bs = "build --profile release-small"
bf = "build --profile release-fast"

# Run commands
r = "run --bin server"
rr = "run --release --bin server"
rf = "run --profile release-fast --bin server"

# Test commands
t = "test -- --nocapture"
tt = "test -- --nocapture --test-threads=1"
tc = "test --release -- --nocapture"

# Development workflow
dev = "watch -x 'run --bin server'"              # requires cargo-watch
check-all = "check --all-targets --all-features"

# Clean and build
clean-all = "clean"
cb = "clean && build --release"

# Lint and format
fmt-check = "fmt --all -- --check"
clippy-all = "clippy --all-targets --all-features -- -D warnings"
fc = "fmt --all && clippy --all-targets --all-features"

# Size analysis
bloat = "bloat --release -n 20" # requires cargo-bloat
tree = "tree --depth 3"         # Show dependency tree
