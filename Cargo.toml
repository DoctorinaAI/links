[package]
name = "links"
version = "0.0.1"
description = "A simple link shortener service"
repository = "https://github.com/DoctorinaAI/links"
homepage = "https://doctorina.com"
authors = ["Mike Matiunin <plugfox@gmail.com>"]
license = "MIT"
edition = "2024"

# Lint settings for the entire project
[lints.rust]
dead_code = "allow"
unused_variables = "allow"

# Start server and link shortener,
# this is the main entry point of the application.
# cargo run --release --bin server
[[bin]]
name = "server"
path = "bin/server.rs"

# cargo build (dev profile with some optimizations for faster runtime during development)
[profile.dev]
opt-level = 1      # Basic optimizations for reasonable performance
debug = true       # Keep debug info
incremental = true # Fast recompilation

# cargo build --release
# Default binary target - balanced optimization
# ~ 6.8 MB
[profile.release]
opt-level = 3      # Maximum optimization
lto = "thin"       # Thin LTO - good balance between speed and compile time
codegen-units = 16 # Parallel codegen for faster builds
panic = "abort"    # Smaller binary, no unwinding
strip = true       # Remove debug symbols
debug = false      # No debug info

# cargo build --profile release-small
# For smallest binary size (slightly slower runtime, slower compilation)
# ~ 4.1 MB
[profile.release-small]
inherits = "release"
opt-level = "z"      # Optimize for size
lto = "fat"          # Full LTO for maximum size reduction
codegen-units = 1    # Single codegen unit for better optimization
panic = "abort"
strip = true

# cargo build --profile release-fast
# For fastest runtime (larger binary, much slower compilation)
# Production-ready with maximum performance
[profile.release-fast]
inherits = "release"
opt-level = 3        # Maximum optimization level
lto = "fat"          # Full LTO for maximum performance
codegen-units = 1    # Single unit for best optimization
panic = "abort"
strip = true
# Additional performance flags
overflow-checks = false  # Disable overflow checks in hot paths
debug-assertions = false

[dependencies]

# Async runtime
futures = "0.3.31"
tokio = { version = "1.48.0", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "io-util",
    "net",
    "signal",
] }

# Utilities
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
once_cell = "1.21.3"

# Configuration
clap = { version = "4.5.50", features = ["derive", "env"] }

# Database
sqlx = { version = "0.8.6", features = [
    "sqlite",
    "postgres",
    "runtime-tokio-native-tls",
    "migrate",
] }

# HTTP client
reqwest = { version = "0.12.24", features = [
    "json",
    "rustls-tls",
], default-features = false }

# JWT validation
jsonwebtoken = { version = "10.1.0", default-features = false, features = [
    "use_pem",
    "rust_crypto",
] }
base64 = "0.22.1"

# HTTP server (for API)
axum = { version = "0.8.6", default-features = false, features = [
    "http1",
    "http2",
    "json",
    "matched-path",
    "original-uri",
    "tokio",
    "tower-log",
    "tracing",
] }
tower = { version = "0.5.2", default-features = false, features = [
    "util",
    "timeout",
    "limit",
] }
tower-http = { version = "0.6.6", default-features = false, features = [
    "cors",
    "trace",
    "limit",
    "request-id",
    "util",
    "timeout",
    "compression-full",
] }

# OpenAPI documentation
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

# Captcha image generation
#image = { version = "0.25.6", features = ["webp"] }
#rusttype = "0.9.3"
#rand = "0.9.1"

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = [
    "env-filter",
    "fmt",
    "json",
] }
tracing-appender = "0.2.3"
tracing-log = "0.2.0"

# Time handling
chrono = { version = "0.4.42", features = ["serde"] }
url = "2.5.7"

[dev-dependencies]
tempfile = "3.23.0"
