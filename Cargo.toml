[package]
name = "links"
version = "0.0.1"
description = "A simple link shortener service"
repository = "https://github.com/DoctorinaAI/links"
homepage = "https://doctorina.com"
authors = ["Mike Matiunin <plugfox@gmail.com>"]
license = "MIT"
edition = "2024"

# Lint settings for the entire project
[lints.rust]
dead_code = "allow"
unused_variables = "allow"

# Start server and link shortener,
# this is the main entry point of the application.
# cargo run --release --bin server
[[bin]]
name = "server"
path = "bin/server.rs"

# cargo run --release
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]

# Async runtime
futures = "0.3.31"
tokio = { version = "1.48.0", features = ["full"] }

# Utilities
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
once_cell = "1.21.3"

# Configuration
clap = { version = "4.5.50", features = ["derive", "env"] }

# Database
sqlx = { version = "0.8.6", features = [
    "sqlite",
    "postgres",
    "runtime-tokio-native-tls",
    "migrate",
] }

# HTTP client
#reqwest = { version = "0.12.24", features = ["json", "multipart"] }

# HTTP server (for API)
axum = "0.8.6"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = [
    "cors",
    "trace",
    "limit",
    "request-id",
    "util",
    "timeout",
    "compression-full",
] }

# OpenAPI documentation
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

# Captcha image generation
#image = { version = "0.25.6", features = ["webp"] }
#rusttype = "0.9.3"
#rand = "0.9.1"

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = [
    "env-filter",
    "fmt",
    "json",
] }
tracing-appender = "0.2.3"
tracing-log = "0.2.0"

# Time handling
chrono = { version = "0.4.42", features = ["serde"] }

[dev-dependencies]
tempfile = "3.23.0"
